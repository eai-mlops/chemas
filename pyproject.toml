[build-system]
requires = ["hatchling>=1.25", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "eai-schemas"
dynamic = ["version"]
description = "Reusable Pydantic input models for generative-AI task types (text-to-image, text-to-video, TTS, STT, 3D, vision, ...)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mashi", email = "mashi@bvm.network" }]
keywords = ["pydantic", "schemas", "generative-ai", "text-to-image", "text-to-video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/eai-mlops/eai-schemas"
Issues = "https://github.com/eai-mlops/eai-schemas/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/eai_schemas/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eai_schemas"]

[tool.hatch.build.targets.sdist]
include = [
    "src/eai_schemas",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
